name: Supabase keep-alive

# Free Supabase projects pause after ~7 days of low database activity.
# Daily app use normally prevents this, but this ping is insurance for
# vacations/gaps: a real DB query every 3 days resets the inactivity timer.
# (Note: GitHub disables cron workflows on repos with no activity for 60
# days — pushing anything re-enables them.)

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -fsS \
            -H "apikey: sb_publishable_qnayXwSoPUz0ozWeX1HkbQ_cTViyoAz" \
            -H "Authorization: Bearer sb_publishable_qnayXwSoPUz0ozWeX1HkbQ_cTViyoAz" \
            "https://aqwukyaeiirwcajqdlda.supabase.co/rest/v1/profiles?select=id&limit=1" \
            > /dev/null && echo "Supabase is awake"
